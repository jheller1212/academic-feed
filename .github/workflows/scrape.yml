name: Scrape Academic Feeds

on:
  schedule:
    # Daily at 07:00 CET (05:00 UTC), 12:00 CET (10:00 UTC), 18:00 CET (16:00 UTC)
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Commit updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/articles.json public/sources_meta.json
          git diff --cached --quiet || git commit -m "chore: update articles $(date -u +%Y-%m-%dT%H:%M)"
          git push
